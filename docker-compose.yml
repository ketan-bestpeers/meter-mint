version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metermint-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metermint_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: metermint-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metermint-backend
    restart: always
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/metermint_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=4000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
